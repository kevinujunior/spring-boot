<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Edit Student</title></head>
<body>
<h2>Edit Student</h2>
<form th:action="@{'/students/' + ${student.id}}" th:object="${student}" method="post">
    First Name: <input type="text" th:field="*{firstName}"><br>
    Last Name: <input type="text" th:field="*{lastName}"><br>
    Email: <input type="text" th:field="*{email}"><br>
    <button type="submit">Update</button>
</form>
<a th:href="@{/students}">Back</a>
</body>
</html>
